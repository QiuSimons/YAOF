name: R3S-OpenWrt

on:
#  schedule:
#    - cron: 5 6 * * 0
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt version or series (e.g. 25.12, 24.10, or latest)"
        required: false
        type: string
        default: "latest"

jobs:
  build:
    uses: ./.github/workflows/OpenWrt-Matrix.yml
    with:
      targets: "R3S"
      version: ${{ inputs.version || 'latest' }}
